name: Render Kennji-pm Profile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_profile.py"
      - ".github/workflows/profile-os.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: profile-os-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install renderer
        run: pip install -r requirements.txt

      - name: Render live dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_profile.py

      - name: Publish refreshed signal
        run: |
          if git diff --quiet -- assets/kennji-pm.png; then
            echo "Dashboard unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kennji-pm.png
          git commit -m "chore(profile): refresh Kennji-pm signal"
          git push
